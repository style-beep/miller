    if (n >= 1000000) return (n/1000000).toFixed(1)+"M";
    if (n >= 1000)    return (n/1000).toFixed(1)+"K";

    return `<div class="mypf-ach${on?"":" locked"}" data-rare="${a.rare}" style="--ach-shine:${r.shine}">

  document.querySelector("main")?.remove();
  document.title = `${displayName} | MILLER FAMILY`;

  wrap.innerHTML = `

    if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
  });

    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>&nbsp; Сохранение...';
    try {
      const res = await fetch("/api/auth/profile", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (data.success) {
        btn.innerHTML = '<i class="fa-solid fa-check"></i>&nbsp; Сохранено!';

        btn.style.background = "rgba(255,42,42,0.3)";
        setTimeout(() => { btn.innerHTML = orig; btn.style.background = ""; btn.disabled = false; }, 2000);
      }
    } catch {
      btn.innerHTML = orig; btn.style.background = ""; btn.disabled = false;
    }
  }

  document.getElementById("saveProfile").onclick = async function() {
    await save({
      username:   document.getElementById("edit_username").value.trim().substring(0,32),
      bio:        document.getElementById("edit_bio").value.trim().substring(0,300),
      statusText: document.getElementById("edit_status").value.trim().substring(0,60),

  };
