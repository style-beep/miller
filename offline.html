<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Нет соединения | MILLER FAMILY</title>
  <link rel="icon" type="image/png" href="images/family-logo.jpeg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #050505; color: #fff;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .bg {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(ellipse at center, rgba(80,0,0,0.12), #050505 70%);
    }

    .emblem {
      width: 80px; height: 80px; object-fit: contain;
      filter: grayscale(1) opacity(0.3);
      margin-bottom: 32px;
    }
    .code {
      font-size: 11px; font-weight: 700; letter-spacing: 6px;
      color: rgba(255,42,42,0.4); margin-bottom: 16px;
      text-transform: uppercase;
    }
    h1 {
      font-size: clamp(28px, 6vw, 56px); font-weight: 900;
      letter-spacing: 4px; color: #fff; margin-bottom: 12px;
    }
    h1 span { color: rgba(255,42,42,0.7); }
    p {
      font-size: 14px; color: rgba(255,255,255,0.3);
      letter-spacing: 1px; line-height: 1.7;
      max-width: 420px; margin-bottom: 40px;
    }
    .divider {
      width: 60px; height: 1px; margin: 0 auto 40px;
      background: linear-gradient(90deg, transparent, rgba(255,42,42,0.3), transparent);
    }
    .btn {
      display: inline-block; padding: 14px 32px;
      background: rgba(255,42,42,0.1);
      border: 1px solid rgba(255,42,42,0.3);
      border-radius: 8px; color: rgba(255,42,42,0.8);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px; font-weight: 800;
      letter-spacing: 3px; text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .btn:hover {
      background: rgba(255,42,42,0.18);
      border-color: rgba(255,42,42,0.5);
    }
    .status {
      margin-top: 40px; font-size: 11px; letter-spacing: 2px;
      color: rgba(255,255,255,0.1);
    }
    .status span { color: rgba(255,42,42,0.3); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <img src="images/miller-emblem.png" alt="" class="emblem"/>
  <div class="code">// CONNECTION LOST //</div>
  <h1>НЕТ<br><span>СОЕДИНЕНИЯ</span></h1>
  <div class="divider"></div>
  <p>Отсутствует подключение к интернету.<br>Часть контента доступна в офлайн-режиме.</p>
  <button class="btn" onclick="location.reload()">↺ &nbsp; ПОПРОБОВАТЬ СНОВА</button>
  <div class="status">MILLER FAMILY · DEL PERRO RP · <span>OFFLINE</span></div>

  <script>
    // Автоматически перейти на главную когда соединение восстановится
    window.addEventListener("online", () => location.href = "/");
  </script>
</body>
</html>
